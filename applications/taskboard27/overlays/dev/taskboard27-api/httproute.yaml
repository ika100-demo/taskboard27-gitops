apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: taskboard27-api
  labels:
    app: taskboard27-api
    app.kubernetes.io/name: taskboard27-api
    app.kubernetes.io/part-of: taskboard27
    app.kubernetes.io/managed-by: gitops-app
spec:
  parentRefs:
  - name: traefik-gateway
    namespace: kube-system
  hostnames:
  - taskboard27-api.taskboard27-dev.localhost
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: taskboard27-api
      port: 80

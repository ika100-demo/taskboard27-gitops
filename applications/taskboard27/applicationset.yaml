apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: taskboard27-dev
  namespace: argocd
spec:
  generators:
  - list:
      elements:
      - name: taskboard27-api
      - name: taskboard27-web
  template:
    metadata:
      name: '{{name}}-dev'
    spec:
      project: default
      source:
        repoURL: https://github.com/ika100-demo/taskboard27-gitops
        targetRevision: main
        path: applications/taskboard27/overlays/dev/{{name}}
      destination:
        server: https://kubernetes.default.svc
        namespace: taskboard27-dev
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - CreateNamespace=true
---
